name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check all entrypoints
        shell: bash
        run: |
          node --check index.js
          node --check client.js
          for f in src/*.js; do node --check "$f"; done
          for f in test/*.mjs; do node --check "$f"; done

      - name: Host tests (unit + gateway e2e + protocol fixture)
        run: node test/run.mjs

      - name: UI render smoke
        run: node test/render-smoke.mjs

      - name: Package integrity (files field matches disk)
        shell: bash
        run: |
          node -e "
          const p = require('./package.json');
          const fs = require('fs');
          const missing = (p.files ?? []).filter(f => !fs.existsSync(f));
          if (missing.length) { console.error('files 引用了不存在的路径:', missing); process.exit(1); }
          console.log('files 字段完整:', (p.files ?? []).length, '项');
          "

      - name: npm pack dry-run (tarball shape + size sanity)
        shell: bash
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.log || true
          node -e "
          const fs = require('fs');
          const log = fs.readFileSync('pack-output.log', 'utf8');
          if (!log.includes('dsh-credit-hub-')) { console.error('npm pack 未产出包名'); process.exit(1); }
          if (!log.includes('total files:')) { console.error('npm pack 输出缺 total files'); process.exit(1); }
          const m = log.match(/total files: (\d+)/);
          const count = Number(m[1]);
          if (count < 25) { console.error('打包文件数异常:', count); process.exit(1); }
          console.log('pack OK:', count, 'files');
          "

      - name: market-index.json validation (format 1 rules)
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const idx = JSON.parse(fs.readFileSync('market-index.json', 'utf8'));
          if (idx.format !== 1) throw new Error('format 必须是 1');
          if (!idx.title || !idx.title.en || !idx.title.zh) throw new Error('title 需含 en/zh');
          if (!Array.isArray(idx.plugins) || idx.plugins.length === 0) throw new Error('plugins 为空');
          for (const p of idx.plugins) {
            if (!/^[a-z0-9][a-z0-9._-]*$/.test(p.name)) throw new Error('非法包名: ' + p.name);
            if (!Array.isArray(p.versions) || p.versions.length === 0) throw new Error(p.name + ' 无版本');
            for (const v of p.versions) {
              if (!/^[0-9a-f]{40}$/.test(v.source?.commit ?? '')) throw new Error(p.name + '@' + v.version + ' commit 非法');
              if (v.source?.type !== 'git' && v.source?.type !== 'npm') throw new Error('source.type 非法');
              if (!Number.isFinite(v.publishTimestamp)) throw new Error('publishTimestamp 非法');
            }
          }
          console.log('market-index OK:', idx.plugins.length, '插件');
          "

      - name: Docs internal links check (relative md targets exist)
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const files = ['README.md', 'docs/ARCHITECTURE.md', 'docs/TROUBLESHOOTING.md'];
          let bad = 0;
          for (const file of files) {
            if (!fs.existsSync(file)) { console.error('缺文件:', file); bad++; continue; }
            const text = fs.readFileSync(file, 'utf8');
            for (const m of text.matchAll(/\]\(([^)#]+?)(?:#[^)]*)?\)/g)) {
              const target = m[1].trim();
              if (!target || /^https?:\/\//.test(target) || target.startsWith('mailto:')) continue;
              const resolved = path.resolve(path.dirname(file), decodeURI(target));
              if (!fs.existsSync(resolved)) { console.error(file, '-> 死链接:', target); bad++; }
            }
          }
          if (bad > 0) process.exit(1);
          console.log('docs links OK');
          "

      - name: npm audit (high/critical only, non-blocking)
        run: npm audit --audit-level=high || true

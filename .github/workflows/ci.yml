name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check all entrypoints
        shell: bash
        run: |
          node --check index.js
          node --check client.js
          for f in src/*.js src/transforms/*.js; do node --check "$f"; done
          for f in test/*.mjs; do node --check "$f"; done

      - name: Host tests (unit + gateway e2e + protocol fixture + transform contracts)
        run: node test/run.mjs

      - name: Client apply contract (slot registration)
        run: node test/client-apply.mjs

      - name: UI render smoke
        run: node test/render-smoke.mjs

      - name: Package integrity (files field matches disk)
        shell: bash
        run: |
          node -e "
          const p = require('./package.json');
          const fs = require('fs');
          const missing = (p.files ?? []).filter(f => !fs.existsSync(f));
          if (missing.length) { console.error('files 引用了不存在的路径:', missing); process.exit(1); }
          console.log('files 字段完整:', (p.files ?? []).length, '项');
          "

      - name: npm pack dry-run (tarball shape + size sanity)
        shell: bash
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.log || true
          node -e "
          const fs = require('fs');
          const log = fs.readFileSync('pack-output.log', 'utf8');
          if (!log.includes('dsh-credit-hub-')) { console.error('npm pack 未产出包名'); process.exit(1); }
          const m = log.match(/total files: (\d+)/);
          if (!m) { console.error('npm pack 输出缺 total files'); process.exit(1); }
          const count = Number(m[1]);
          if (count < 25) { console.error('打包文件数异常:', count); process.exit(1); }
          if (!log.includes('transforms/openai.js')) { console.error('打包产物缺 transforms 模块'); process.exit(1); }
          console.log('pack OK:', count, 'files');
          "

      - name: Release artifact checks (pack contents / secrets / version sync / install safety)
        run: node test/release-check.mjs

      - name: Docs internal links check (relative md targets exist)
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const files = ['README.md', 'docs/ARCHITECTURE.md', 'docs/TROUBLESHOOTING.md', 'docs/PROTOCOL-MATRIX.md'];
          let bad = 0;
          for (const file of files) {
            if (!fs.existsSync(file)) { console.error('缺文件:', file); bad++; continue; }
            const text = fs.readFileSync(file, 'utf8');
            for (const m of text.matchAll(/\]\(([^)#]+?)(?:#[^)]*)?\)/g)) {
              const target = m[1].trim();
              if (!target || /^https?:\/\//.test(target) || target.startsWith('mailto:')) continue;
              const resolved = path.resolve(path.dirname(file), decodeURI(target));
              if (!fs.existsSync(resolved)) { console.error(file, '-> 死链接:', target); bad++; }
            }
          }
          if (bad > 0) process.exit(1);
          console.log('docs links OK');
          "

      - name: npm audit (high/critical only, non-blocking)
        run: npm audit --audit-level=high || true